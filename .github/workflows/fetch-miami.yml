name: Fetch Miami (RapidAPI)

on:
  schedule:
    - cron: "0 9 * * 1-6"   # 09:00 UTC = 06:00 Brasília, seg–sáb
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só testar (não grava no banco)"
        type: boolean
        default: true

jobs:
  fetch:
    name: Buscar FLN⇄MIA (RapidAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Buscar preços e salvar no Supabase
        env:
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
          RAPIDAPI_KEY:  ${{ secrets.RAPIDAPI_KEY }}
          # workflow_dispatch: usa o toggle (padrão: só testar).
          # schedule: input vazio → grava normalmente.
          MIAMI_DRY_RUN: ${{ inputs.dry_run }}
        run: python fetch_miami.py
